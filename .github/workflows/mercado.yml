name: Atualizar mercado (Banco Central)

on:
  schedule:
    - cron: "17 13 * * 1-5" # dias úteis, 10h17 em Brasília
  workflow_dispatch:

env:
  PROJECT_REF: dxizuewsqkymogbeanlh

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | node -e 'const k=JSON.parse(require("fs").readFileSync(0,"utf8"));const a=k.find(x=>x.name==="anon")||k.find(x=>x.type==="publishable");process.stdout.write(a?a.api_key:"")')
          curl -sS --fail-with-body -X POST "https://$PROJECT_REF.supabase.co/functions/v1/mercado" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "content-type: application/json" -d '{"forcar":true}'
