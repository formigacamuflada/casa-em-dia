name: App do Windows

on:
  push:
    branches: [main]
    paths-ignore: ["supabase/**", "extensao-claude/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

env:
  PROJECT_REF: dxizuewsqkymogbeanlh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Chave pública do Supabase
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY="${{ vars.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$KEY" ]; then
            KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json | node -e 'const k=JSON.parse(require("fs").readFileSync(0,"utf8"));const a=k.find(x=>x.name==="anon")||k.find(x=>x.type==="publishable");process.stdout.write(a?a.api_key:"")')
          fi
          test -n "$KEY" || { echo "::error::Não consegui obter a chave pública do Supabase"; exit 1; }
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=https://$PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Casa em Dia v__VERSION__"
          releaseBody: "Baixe o instalador .exe (recomendado) ou o .msi e abra para instalar no Windows."
          releaseDraft: false
          prerelease: false
